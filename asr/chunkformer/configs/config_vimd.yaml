model:
  model_id: "khanhld/chunkformer-large-vie"  # Base model checkpoint
  language: "vi"
  task: "transcribe"
  device: "cuda"
  # Chunkformer specific parameters
  chunk_size: 64
  left_context_size: 128
  right_context_size: 128
  total_batch_duration: 14400  # seconds

dataset:
  name: "nguyendv02/ViMD_Dataset"
  cache_dir: "./cache"
  sampling_rate: 16000
  regions: ["All", "Central", "South", "North"]
  max_audio_length: 600  # seconds, for long audio chunking

training:
  output_dir: "./logs/chunkformer-vimd-{region}-vi"
  eval_output_dir: "./outputs/chunkformer-vimd-{region}-vi"
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2e-5
  warmup_steps: 100
  save_steps: 100
  save_total_limit: 3
  logging_steps: 50
  fp16: false
  bf16: true
  optim: "adamw_torch"
  eval_strategy: "steps"
  eval_steps: 100
  per_device_eval_batch_size: 1
  metric_for_best_model: "wer"
  greater_is_better: false
  load_best_model_at_end: true
  save_strategy: "steps"
  num_train_epochs: 5
  max_grad_norm: 1.0
  dataloader_num_workers: 4
  remove_unused_columns: false
  hub_model_id: "your-username/chunkformer-vimd-{region}-vi"

eval:
  compute_metrics: true
  eval_on_train: false
  eval_on_test: true
  eval_on_dev: true
  eval_on_all: false
  eval_on_all_regions: true
  regions: ["All", "Central", "South", "North"]
  region: "{region}"
  test_split: "test"
  dev_split: "valid"
  train_split: "train"
  all_split: "all"

wandb:
  project: "Chunkformer_ViMD"
  run_name: "chunkformer_finetune_{region}"

logging:
  log_dir: "./logs"
  log_file: "chunkformer_vimd_{region}_v1.log"

data_processing:
  # Audio preprocessing
  normalize_audio: true
  chunk_overlap: 0.1  # 10% overlap between chunks
  min_chunk_length: 1.0  # minimum chunk length in seconds
  max_chunk_length: 30.0  # maximum chunk length in seconds
  padding_value: 0.0
  
  # Text preprocessing  
  normalize_text: true
  remove_punctuation: false
  lowercase: false
  max_text_length: 512